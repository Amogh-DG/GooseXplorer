[package]
name = "filelester"
version = "0.1.0"
edition = "2021"

[dependencies]
slint = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
notify = "6"
dirs = "5"
chrono = "0.4"

[build-dependencies]
slint-build = "1"
